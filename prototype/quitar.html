<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>document.documentElement.dataset.theme = localStorage.getItem('rateio:theme') || 'light';</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rateio — Quitar dívidas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="proto-bar">
  <strong>Rateio</strong> — protótipo estático
  <span class="sep">·</span>
  <a href="index.html">grupos</a>
  <span class="sep">·</span>
  <a href="quitar.html?id=churras">quitar (com dívidas)</a>
  <span class="sep">·</span>
  <a href="quitar.html?id=republica">quitar (vazio)</a>
  <button class="reset" id="theme-toggle"></button>
</div>

<div class="stage">
  <div class="device">
    <div class="statusbar"><span class="time">9:41</span><span>●●●</span></div>

    <div class="topbar">
      <a class="back" id="back-link" href="grupo.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Quitar dívidas</h1>
    </div>

    <div class="screen with-bottombar" id="screen"></div>

    <div class="bottombar">
      <span id="bell-slot"></span>
      <a class="tab active" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/></svg>
        Grupos
      </a>
      <span id="auth-slot"></span>
    </div>

    <div class="overlay" id="overlay"><div class="spinner"></div><span>Registrando…</span></div>
    <div class="toast" id="toast"><span class="ok-dot"></span><span class="msg"></span></div>
  </div>
</div>

<script src="app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const groupId = params.get('id') || 'churras';
document.getElementById('back-link').href = `grupo.html?id=${groupId}`;

function render() {
  const state = getState();
  renderNotifBell(state, false);
  renderHeaderAuth(state, false);
  const group = state.groups.find(g => g.id === groupId);
  const saldos = computeBalances(group);
  const transacoes = computeSettlement(saldos);
  const screen = document.getElementById('screen');

  if (transacoes.length === 0) {
    screen.innerHTML = `
      <div class="empty-state">
        <div class="mark">
          <svg class="icon" style="width:40px;height:40px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        </div>
        <h2>Grupo quitado</h2>
        <p>Ninguém deve nada a ninguém em "${group.nome}".</p>
      </div>`;
    return;
  }

  screen.innerHTML = `
    <p style="font-size:13px;color:var(--ink-soft);margin:14px 0 4px">
      Menor número de transferências pra zerar todos os saldos do grupo.
    </p>
    <div id="lista">
      ${transacoes.map((t, i) => `
        <div class="settle-row" data-idx="${i}">
          <div class="settle-flow">
            ${participantName(group, t.de)} → ${participantName(group, t.para)}
            <span class="amount">${fmtMoney(t.valor)}</span>
          </div>
          <button class="btn btn-secondary quitar-btn" data-de="${t.de}" data-para="${t.para}" data-valor="${t.valor}">Marcar como pago</button>
        </div>`).join('')}
    </div>`;

  screen.querySelectorAll('.quitar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      showOverlay('Registrando quitação…');
      setTimeout(() => {
        const s = getState();
        const g = s.groups.find(g => g.id === groupId);
        g.quitacoes.push({ id: 'q' + Date.now(), deId: btn.dataset.de, paraId: btn.dataset.para, valor: parseFloat(btn.dataset.valor), data: new Date().toISOString().slice(0, 10) });
        if (g.synced) {
          notify(s, `${participantName(g, btn.dataset.de)} quitou ${fmtMoney(btn.dataset.valor)} com ${participantName(g, btn.dataset.para)} em "${g.nome}".`);
        }
        saveState(s);
        hideOverlay();
        showToast('Dívida quitada.');
        render();
      }, 550);
    });
  });
}

render();
</script>
</body>
</html>
