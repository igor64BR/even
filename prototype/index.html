<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>document.documentElement.dataset.theme = localStorage.getItem('rateio:theme') || 'light';</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rateio — Seus grupos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="proto-bar">
  <strong>Rateio</strong> — protótipo estático
  <span class="sep">·</span>
  <a href="index.html">grupos</a>
  <span class="sep">·</span>
  <a href="criar-grupo.html">criar grupo</a>
  <span class="sep">·</span>
  <a href="grupo.html?id=churras">grupo (local)</a>
  <span class="sep">·</span>
  <a href="grupo.html?id=praia">grupo (sincronizado)</a>
  <span class="sep">·</span>
  <a href="login.html">login</a>
  <span class="sep">·</span>
  <a href="notificacoes.html">notificações</a>
  <span class="sep">·</span>
  <a href="index.html?vazio=1">grupos (estado vazio)</a>
  <button class="reset" id="theme-toggle"></button>
  <button class="reset" id="reset-btn" style="margin-left:10px">↺ resetar dados de demonstração</button>
</div>

<div class="stage">
  <div class="device">
    <div class="statusbar"><span class="time">9:41</span><span>●●●</span></div>

    <div class="topbar">
      <h1>Seus grupos</h1>
    </div>

    <div class="screen with-bottombar" id="screen"></div>

    <a class="fab above-bar" href="criar-grupo.html" title="Criar grupo">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.9-3.4 3-5 5.5-5s4.6 1.6 5.5 5"/><path d="M18 8v5M15.5 10.5h5"/></svg>
    </a>

    <div class="bottombar">
      <span id="bell-slot"></span>
      <a class="tab active" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/></svg>
        Grupos
      </a>
      <span id="auth-slot"></span>
    </div>

    <div class="overlay" id="overlay"><div class="spinner"></div><span>Carregando…</span></div>
    <div class="toast" id="toast"><span class="ok-dot"></span><span class="msg"></span></div>
  </div>
</div>

<script src="app.js"></script>
<script>
function balanceInfo(group, saldos) {
  const you = saldos['voce'] || 0;
  if (Math.abs(you) < 0.01) return { cls: 'neutral', label: 'quitado', value: '' };
  if (you > 0) return { cls: 'credit', label: 'te devem', value: fmtMoney(you) };
  return { cls: 'owed', label: 'você deve', value: fmtMoney(-you) };
}

function render() {
  const state = getState();
  renderHeaderAuth(state, false);
  renderNotifBell(state, false);

  const screen = document.getElementById('screen');
  const forceEmpty = new URLSearchParams(location.search).get('vazio') === '1';

  if (state.groups.length === 0 || forceEmpty) {
    screen.innerHTML = `
      <div class="empty-state">
        <div class="mark">
          <svg class="icon" style="width:40px;height:40px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 6V4h8v2"/><path d="M8 12h8M8 16h5"/></svg>
        </div>
        <h2>Nenhum grupo ainda</h2>
        <p>Criar um leva 10 segundos. Não precisa de conta — nem sua, nem de quem vai dividir a conta com você.</p>
        <a class="btn btn-primary" href="criar-grupo.html" style="width:auto;padding:11px 22px">Criar grupo</a>
      </div>`;
    return;
  }

  screen.innerHTML = state.groups.map(g => {
    const saldos = computeBalances(g);
    const b = balanceInfo(g, saldos);
    const initialsTag = g.nome.split(' ').filter(w => w.length > 2 || /^[A-ZÀ-Ú]/.test(w)).slice(0, 1)[0]?.slice(0, 2).toUpperCase() || g.nome.slice(0, 2).toUpperCase();
    return `
      <a class="group-card" href="grupo.html?id=${g.id}">
        <div class="group-tag">${initialsTag}</div>
        <div class="group-info">
          <div class="name">${g.nome}</div>
          <div class="meta">${g.participantes.length} pessoas ${syncIcon(g.synced)}</div>
        </div>
        <div class="balance ${b.cls}">
          ${b.value ? `<span class="label">${b.label}</span>${b.value}` : 'quitado'}
        </div>
      </a>`;
  }).join('');
}

document.getElementById('reset-btn').addEventListener('click', () => {
  resetState();
  render();
  showToast('Dados de demonstração restaurados.');
});

render();
</script>
</body>
</html>
