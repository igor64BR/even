<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>document.documentElement.dataset.theme = localStorage.getItem('tally:theme') || 'light';</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tally — Group</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="proto-bar">
  <strong>Tally</strong> — static prototype
  <span class="sep">·</span>
  <a href="index.html">groups</a>
  <span class="sep">·</span>
  <a href="create-group.html">create group</a>
  <span class="sep">·</span>
  <a href="group.html?id=churras">group (local)</a>
  <span class="sep">·</span>
  <a href="group.html?id=praia">group (synced)</a>
  <span class="sep">·</span>
  <a href="group.html?id=republica">group (empty)</a>
  <span class="sep">·</span>
  <a href="login.html">sign in</a>
</div>

<div class="stage">
  <div class="device">
    <div class="statusbar"><span class="time">9:41</span><span>●●●</span></div>

    <div class="topbar">
      <a class="back" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1 id="titulo">Group</h1>
      <button class="icon-btn" id="theme-toggle"></button>
    </div>

    <div class="screen with-bottombar" id="screen"></div>

    <a class="fab above-bar" id="fab" href="#" title="New expense">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 3v18M16.5 7.5H10a2.8 2.8 0 0 0 0 5.6h4a2.8 2.8 0 0 1 0 5.6H7"/></svg>
    </a>

    <div class="bottombar">
      <span id="bell-slot"></span>
      <a class="tab active" href="index.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-9"/></svg>
        Groups
      </a>
      <span id="auth-slot"></span>
    </div>

    <div class="overlay" id="overlay"><div class="spinner"></div><span>Loading…</span></div>
    <div class="toast" id="toast"><span class="ok-dot"></span><span class="msg"></span></div>
  </div>
</div>

<script src="app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const groupId = params.get('id') || 'churras';

function tipoLabel(tipo) {
  return { igual: 'split equally', percentual: 'split by %', fixo: 'fixed amount per person' }[tipo] || tipo;
}

function render() {
  const state = getState();
  renderNotifBell(state, false);
  renderHeaderAuth(state, false);
  const group = state.groups.find(g => g.id === groupId);
  if (!group) { document.getElementById('screen').innerHTML = '<div class="empty-state"><h2>Group not found</h2></div>'; return; }

  document.getElementById('titulo').textContent = group.nome;
  document.getElementById('fab').href = `new-expense.html?id=${group.id}`;

  const saldos = computeBalances(group);
  const screen = document.getElementById('screen');

  const saldosHtml = group.participantes.map(p => {
    const v = saldos[p.id] || 0;
    let cls = 'neutral', label = '', value = 'settled up';
    if (v > 0.01) { cls = 'credit'; label = 'gets back'; value = fmtMoney(v); }
    else if (v < -0.01) { cls = 'owed'; label = 'owes'; value = fmtMoney(-v); }
    return `
      <div class="split-row">
        <div class="who">${p.nome}${p.isYou ? ' <span class="pill">you</span>' : ''}</div>
        <div class="balance ${cls}">${label ? `<span class="label">${label}</span>` : ''}${value}</div>
      </div>`;
  }).join('');

  const despesasHtml = group.despesas.length === 0 ? `
    <div class="empty-state" style="padding:34px 10px">
      <h2>No expenses yet</h2>
      <p>Add the first expense and each participant's balance will show up here.</p>
    </div>` : [...group.despesas].reverse().map(d => `
      <div class="expense-row">
        <div class="expense-mark">
          <svg class="icon" style="width:17px;height:17px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2v20M17 6H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H7"/></svg>
        </div>
        <div class="expense-info">
          <div class="desc">${d.descricao}</div>
          <div class="meta">${participantName(group, d.pagadorId)} paid · ${fmtDate(d.data)} · ${tipoLabel(d.tipo)}</div>
        </div>
        <div class="expense-amount">${fmtMoney(d.valor)}</div>
      </div>`).join('');

  screen.innerHTML = `
    <div class="eyebrow">${group.categoria} · ${group.participantes.length} people · ${syncIcon(group.synced)}</div>

    <div class="eyebrow" style="margin-top:20px">Balances</div>
    ${saldosHtml}

    <a class="btn btn-primary" style="margin-top:16px" href="settle.html?id=${group.id}">Settle debts</a>
    ${!group.synced ? `<a class="btn btn-secondary" style="margin-top:10px" href="login.html?sync=${group.id}">Sync this group</a>` : ''}

    <div class="eyebrow" style="margin-top:22px">Expenses</div>
    <div>${despesasHtml}</div>
  `;
}

render();

if (params.get('novo') === '1') {
  setTimeout(() => showToast('Group created. You can start adding expenses.'), 200);
} else if (params.get('despesa') === '1') {
  setTimeout(() => showToast('Expense saved. Balances updated.'), 200);
} else if (params.get('sync') === '1') {
  setTimeout(() => showToast('Group synced. Notifications turned on.'), 200);
}
</script>
</body>
</html>
